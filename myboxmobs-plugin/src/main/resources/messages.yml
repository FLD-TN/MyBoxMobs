# MyBoxMobs — messages

# Do not change. A file with a lower version is moved to old-configs/ and replaced by the new defaults
config-version: 5
#
# Colours: &a legacy, &#RRGGBB hex, MiniMessage tags (<gradient:#..:#..>), PlaceholderAPI
# Symbols: ✔ success, ✘ error, (!) warning. One line per message, no trailing full stop
# A message set to '' is not sent

